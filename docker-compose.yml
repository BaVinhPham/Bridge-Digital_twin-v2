services:
  db:
    image: timescale/timescaledb:latest-pg16
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U bridge -d bridge"]
      interval: 5s
      timeout: 3s
      retries: 12
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=6)"]
      interval: 10s
      timeout: 8s
      retries: 3
      start_period: 15s
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MODEL_STORE: /data/models
    volumes:
      - model_data:/data/models
    ports:
      - "8000:8000"

  simulator:
    build: .
    profiles: [demo]
    depends_on:
      api:
        condition: service_healthy
    environment:
      MQTT_HOST: mqtt
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./simulator:/simulator:ro
    command: [python, /simulator/simulate.py]

volumes:
  db_data:
  model_data:
