name: bridge-digital-twin-v2

services:
  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    # Internal MQTT only. The API and simulator use the Docker network.
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mqtt:
        condition: service_started
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=40)"]
      interval: 30s
      timeout: 45s
      retries: 3
      start_period: 60s
    environment:
      AZURE_SQL_SERVER: ${AZURE_SQL_SERVER:?Set AZURE_SQL_SERVER in .env}
      AZURE_SQL_DATABASE: ${AZURE_SQL_DATABASE:?Set AZURE_SQL_DATABASE in .env}
      AZURE_SQL_USER: ${AZURE_SQL_USER:?Set AZURE_SQL_USER in .env}
      AZURE_SQL_PASSWORD: ${AZURE_SQL_PASSWORD:?Set AZURE_SQL_PASSWORD in .env}
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MODEL_STORE: /data/models
    volumes:
      - model_data:/data/models
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"

  simulator:
    build: .
    profiles: [demo]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      MQTT_HOST: mqtt
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./simulator:/simulator:ro
    command: [python, /simulator/simulate.py]

volumes:
  model_data:
